name: PR Neon Branch

# Gives each PR its own Neon branch (copied from `e2e`), applies the PR's
# migrations to it, and deploys a Vercel preview wired to that branch. The
# branch and the preview alias are removed when the PR closes.
#
# Vercel's own git integration is off (`apps/web/vercel.json`): it can't know the
# per-PR `DATABASE_URL` and `NEON_AUTH_URL`, so its builds always failed.
#
# Opt out with the `no-db` label: adding it deletes the PR's branch, removing it
# creates one.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - closed

permissions:
  contents: read
  pull-requests: write

# One run per PR at a time. Never cancel: a cancelled create could leave a
# half-migrated branch, and a cancelled delete would leak one.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  NEON_BRANCH: preview/pr-${{ github.event.number }}
  # Stable per-PR hostname. Each push gets a new unique deployment URL; the
  # alias is repointed at it. Neon Auth trusts it through the `*.vercel.app`
  # entry on the `e2e` branch, which every PR branch inherits.
  PREVIEW_HOST: ${{ vars.VERCEL_PREVIEW_PREFIX || 'salabridge-chores-pr' }}-${{ github.event.number }}.vercel.app
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  create_neon_branch:
    name: Create Neon branch, migrate and deploy preview
    # Fork PRs don't get NEON_API_KEY. Other label changes don't touch the database.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.state == 'open'
      && !contains(github.event.pull_request.labels.*.name, 'no-db')
      && (
        contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
        || (github.event.action == 'unlabeled' && github.event.label.name == 'no-db')
      )
    runs-on: ubuntu-latest
    outputs:
      # For later jobs (e2e). GitHub drops a job output that holds a masked
      # value; if the log shows "Skip output ... may contain secret", look the
      # URL up with `neonctl connection-string` in the consuming job instead.
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_pooled: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
      preview_url: ${{ steps.alias.outputs.url }}
    steps:
      - name: Set branch expiration (7 days from now)
        run: echo "EXPIRES_AT=$(date -u --date '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      # Reuses the branch if it already exists, so pushes after the first one
      # only apply the migrations the branch hasn't seen yet.
      - name: Create Neon branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH }}
          parent_branch: e2e
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @chore/db

      # Always runs: drizzle-kit skips migrations already recorded on the
      # branch, so this also catches up a branch whose `e2e` parent is behind.
      - name: Migrate
        run: pnpm --filter @chore/db db:migrate
        env:
          # Unpooled: DDL shouldn't go through PgBouncer.
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}

      # Neon Auth branches with the database, so each PR branch has its own
      # Auth URL. Only the REST API exposes it.
      - name: Look up Neon Auth URL
        id: auth
        run: |
          url=$(curl -fsS \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/auth" \
            | jq -er .base_url)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.create_neon_branch.outputs.branch_id }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The build sees the PR branch's values through the shell environment.
      - name: Build
        run: vercel build --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          NEON_AUTH_URL: ${{ steps.auth.outputs.url }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env NEON_AUTH_URL="$NEON_AUTH_URL")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          NEON_AUTH_URL: ${{ steps.auth.outputs.url }}

      - name: Alias the deployment
        id: alias
        run: |
          vercel alias set "$DEPLOYMENT_URL" "$PREVIEW_HOST" --token "$VERCEL_TOKEN"
          echo "url=https://$PREVIEW_HOST" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}

      # One comment per PR, edited in place on later pushes.
      - name: Comment the preview URL
        run: |
          marker='<!-- pr-neon-preview -->'
          body="$marker"$'\n'"Preview: $PREVIEW_URL"$'\n'"Neon branch: \`$NEON_BRANCH\`"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | first | .id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.alias.outputs.url }}

  delete_neon_branch:
    name: Delete Neon branch and preview
    # On close, unless `no-db` is set (its branch was already deleted, or never
    # existed). When `no-db` is added to an open PR.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.event.action == 'closed' && !contains(github.event.pull_request.labels.*.name, 'no-db'))
        || (github.event.action == 'labeled' && github.event.label.name == 'no-db')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # Frees the hostname. The deployments themselves expire under Vercel's
      # retention settings. Nothing to remove if the PR never had a preview.
      - name: Remove preview alias
        continue-on-error: true
        run: |
          npm install --global vercel@latest
          vercel alias rm "$PREVIEW_HOST" --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
