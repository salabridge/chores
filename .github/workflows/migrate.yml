name: Migrate

# Migrates e2e, then dev, then production. Each job waits for the one before
# it, so a migration that fails on e2e never reaches dev or production.
# Production also waits for a required reviewer on its environment.
#
# Runs when a push to main adds or changes a migration. Schema edits without a
# generated migration change nothing in the database, so they don't trigger it.
# To retry after a failure, re-run the failed jobs from the run's page.
on:
  push:
    branches:
      - main
    paths:
      - packages/db/migrations/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  migrate-e2e:
    name: Migrate (e2e)
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @chore/db

      - name: Migrate
        run: pnpm --filter @chore/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-dev:
    name: Migrate (dev)
    needs: migrate-e2e
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @chore/db

      - name: Migrate
        run: pnpm --filter @chore/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-production:
    name: Migrate (production)
    needs: migrate-dev
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @chore/db

      - name: Migrate
        run: pnpm --filter @chore/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
